apiVersion: v1
kind: Service

metadata:
  name: frontend
  namespace: okapi
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: okapi
    app.kubernetes.io/component: web

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: okapi

  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http