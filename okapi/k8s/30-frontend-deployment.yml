apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: okapi
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: okapi
    app.kubernetes.io/component: web

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/part-of: okapi

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: okapi
        app.kubernetes.io/component: web

    spec:
      terminationGracePeriodSeconds: 10

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: frontend
          image: docker.io/library/okapi-frontend:0.1.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false