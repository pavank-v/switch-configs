apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: okapi
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: okapi
    app.kubernetes.io/component: api

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/part-of: okapi

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: okapi
        app.kubernetes.io/component: api

    spec:
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: backend
          image: docker.io/library/okapi-backend:0.1.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: backend-config

          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            - name: JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: JWT_BASE64_SECRET

          startupProbe:
            httpGet:
              path: /management/health/liveness
              port: http
            periodSeconds: 2
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /management/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /management/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3

          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL