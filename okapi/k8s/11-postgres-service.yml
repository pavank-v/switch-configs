apiVersion: v1
kind: Service

metadata:
  name: postgres
  namespace: okapi
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: okapi
    app.kubernetes.io/component: database

spec:
  clusterIP: None

  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: okapi
  
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: postgres