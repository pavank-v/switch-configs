apiVersion: v1
kind: Service

metadata:
  name: backend
  namespace: okapi

  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: okapi
    app.kubernetes.io/component: api

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: okapi
  
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http