# BEGIN_KITTY_THEME
# Alabaster Dark
include current-theme.conf
# END_KITTY_THEME

confirm_os_window_close 0
window_padding_width 4

# Fonts
font_family JetBrains Mono
font_size 18.5

scrollback_lines 100000
enable_keypad_protocol no

background_opacity 0.80
dynamic_background_opacity yes

hide_window_decorations yes
keyboard_repeat_rate 0
enable_audio_bell no
enabled_layouts tall:bias=50;full_size=1;mirrored=false

enabled_layouts grid

# Move between windows using Super + h/j/k/l
map super+h neighboring_window left
map super+j neighboring_window down
map super+k neighboring_window up
map super+l neighboring_window right

# Vertical split with Super+v
map super+u launch --type=window --location=vsplit

# Horizontal split with Super+s
map super+i launch --type=window --location=hsplit

# Navigation
map ctrl+shift+k scroll_line_up
map ctrl+shift+j scroll_line_down

