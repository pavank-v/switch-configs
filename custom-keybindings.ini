[custom0]
binding='<Shift><Alt>F4'
command='shutdown now'
name='shutdown'

[custom1]
binding='<Super>period'
command='brightnessctl set +1%'
name='brightness up'

[custom2]
binding='<Super>comma'
command='brightnessctl set 1%-'
name='brightness down'

[custom3]
binding='<Super>t'
command='gnome-clocks'
name='open clock'

[custom4]
binding='<Super>s'
command='systemctl suspend'
name='suspend'

[custom5]
binding='<Super>r'
command='/usr/bin/bash /home/pavan/.local/bin/gnome-reset-script.sh\n'
name='restart gnome extensions'
